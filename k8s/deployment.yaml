# TMTools backend Deployment (plan §15).
#
# HA model (plan §3.1, Appendix A.9): 3 replicas, one pod per node via
# required podAntiAffinity, each running exactly 1 uvicorn worker (see
# Dockerfile) that contends for a single Redis leader lock
# (backend.modules.leader.LeaderElection) — only the elected leader runs
# TimerManager/Loader/AutomationEngine/Scraper/Predictor; the passive pod
# still serves reads and the WS event fan-out. RollingUpdate keeps at least
# one pod up during deploys; the init container applies migrations before
# either pod's app container starts serving traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tmtools
  namespace: tmtools
  labels:
    app: tmtools
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: tmtools
  template:
    metadata:
      labels:
        app: tmtools
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - tmtools
              topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: migrate
          image: ghcr.io/example/vex-tm-tools-priv:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: tmtools-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: POSTGRES_DSN
      containers:
        - name: tmtools
          image: ghcr.io/example/vex-tm-tools-priv:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tmtools-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: POSTGRES_DSN
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: REDIS_URL
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: OIDC_ISSUER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: OIDC_CLIENT_SECRET
            - name: ADMIN_LOCAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: ADMIN_LOCAL_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: ENCRYPTION_KEY
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tmtools-secrets
                  key: S3_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
