# Static-only server for the built SPA (the `frontend` image target in the
# repo's Dockerfile). It serves the React app and falls back to index.html
# for client-side routes; it does NOT proxy the API. Put a reverse proxy
# (Traefik/ingress) in front that sends /api, /auth, POST /admin_login, /ws, /healthz and /readyz
# to the backend and everything else here, so the browser sees one origin (same as the bundled
# image). The public and OBS pages (/site, /room/, /station/, /prompter, /overlay/, /replay/,
# /notify) are SPA routes served from here, together with /sw.js and /notify.webmanifest.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker must be revalidated every time and may claim the root scope.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        types { }
        default_type text/javascript;
    }

    location = /notify.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
