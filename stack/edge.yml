# Edge: self-signed wildcard certificate and Traefik (host-based routing, public tunnel origin).
# Part of compose.stack.yml (see its header for configuration).

services:
  cert-init:
    image: alpine:3.20
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-vex.localhost}
    entrypoint: ["sh", "/gen/gen-cert.sh"]
    volumes:
      - certs:/certs
      - ${EXTRA_CA_FILE:-/dev/null}:/extra-ca.pem:ro
    restart: "no"
    configs:
      - source: cfg_gen_cert
        target: /gen/gen-cert.sh

  traefik:
    image: traefik:v3.1
    depends_on:
      cert-init:
        condition: service_completed_successfully
      haproxy-1:
        condition: service_started
      haproxy-2:
        condition: service_started
      authelia:
        condition: service_started
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # The lighting tracker runs on the host network (Art-Net discovery).
      - "host.docker.internal:${HOST_GATEWAY_IP:-172.17.0.1}"
    networks:
      default:
        # Containers (the app, Authelia's browser redirects) reach these names at
        # the same https URL browsers use, which the OIDC issuer check requires.
        aliases:
          - tmtools.${BASE_DOMAIN:-vex.localhost}
          - auth.${BASE_DOMAIN:-vex.localhost}
          - s3.${BASE_DOMAIN:-vex.localhost}
    environment:
      # Only read when a router asks for the `cloudflare` ACME resolver (TLS_RESOLVER=cloudflare).
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - certs:/certs:ro
      - acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    configs:
      - source: cfg_traefik
        target: /etc/traefik/traefik.yml
      - source: cfg_dynamic
        target: /etc/traefik/dynamic.yml

volumes:
  certs:
  acme:

configs:
  cfg_gen_cert:
    file: ./config/gen-cert.sh
  cfg_traefik:
    content: |
      # Static Traefik config for compose.stack.yml.
      # Routing lives in dynamic.yml (file provider), no Docker socket is mounted.
      entryPoints:
        web:
          address: ":80"
          # The homelab ingress (backup path, over the tailnet) terminates TLS
          # and forwards plain http with X-Forwarded-Proto: https; Authelia and
          # the app need to see that. Fine here: this port is LAN/tailnet only.
          forwardedHeaders:
            insecure: true
          transport: &transport
            respondingTimeouts:
              # Uploads (multi-GB videos) and WebSockets must not be cut off.
              readTimeout: 0
              writeTimeout: 0
              idleTimeout: 0s
        websecure:
          address: ":443"
          transport: *transport
        # Reachable only inside the compose network (not published): the
        # Cloudflare tunnel's origin. Serves the public competitors page only.
        public:
          address: ":8081"
          transport: *transport

      # Optional Let's Encrypt wildcard cert via the Cloudflare DNS-01 challenge. Defined
      # but unused until TLS_RESOLVER=cloudflare is set in .env (see compose.stack.yml).
      # Needs CF_DNS_API_TOKEN (Zone:Zone:Read + Zone:DNS:Edit) and a BASE_DOMAIN that is
      # a zone in that Cloudflare account. ACME_CA_SERVER can point at the staging CA.
      certificatesResolvers:
        cloudflare:
          acme:
            email: "${ACME_EMAIL:-}"
            storage: /acme/acme.json
            caServer: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
            dnsChallenge:
              provider: cloudflare
              resolvers: ["1.1.1.1:53", "1.0.0.1:53"]

      providers:
        file:
          filename: /etc/traefik/dynamic.yml
          watch: true

      ping:
        entryPoint: web

      log:
        level: INFO
      accessLog: {}
  cfg_dynamic:
    content: |
      tls:
        # Default certificate: the self-signed wildcard, served for any SNI without a better
        # match (including a bare IP). With TLS_RESOLVER=cloudflare the site-home router below
        # requests a Let's Encrypt cert for BASE and *.BASE, which Traefik then selects by SNI
        # for every router. Traefik only asks ACME for names no provided certificate covers, so
        # also set TLS_CERT_PREFIX=fallback- to make the default a cert that covers nothing.
        stores:
          default:
            defaultCertificate:
              certFile: /certs/${TLS_CERT_PREFIX:-}cert.pem
              keyFile: /certs/${TLS_CERT_PREFIX:-}key.pem

      http:
        middlewares:
          # gzip/brotli for the public competitors page and its API (the page is ~70 KB, /event ~40 KB).
          public-compress:
            compress: {}
          # If an HAProxy copy dies, Traefik keeps sending to it until its next health probe (2 s); a request
          # that gets no answer is retried on the other copy instead of surfacing as a 502.
          app-retry:
            retry:
              attempts: 3
              initialInterval: 50ms
          # comp.BASE/ -> /site. A redirect rather than a path prefix: the page
          # calls absolute /api/v1/public/site/... URLs, which a prefix would break.
          comp-root:
            redirectRegex:
              regex: "^https?://([^/]+)/?$"
              replacement: "https://$${1}/site"
              permanent: false
        routers:
          # No catch-all: only the named hosts below are routed. Any other hostname
          # or a bare IP on :80/:443 gets Traefik's 404. (Login only works over
          # https or the http callback: see the Authelia OIDC redirect URIs.)
          # Named hosts (certificate: the self-signed wildcard for BASE and *.BASE).
          app:
            rule: "Host(`tmtools.${BASE_DOMAIN:-vex.localhost}`) || Host(`tmtools-server.local`)"
            entryPoints: [websecure]
            middlewares: [app-retry]
            service: app
            tls: {}
          site-home:
            rule: "Host(`${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: site-home
            tls:
              certResolver: "${TLS_RESOLVER:-}"
              domains:
                - main: "${BASE_DOMAIN:-vex.localhost}"
                  sans: ["*.${BASE_DOMAIN:-vex.localhost}"]
          site-stats:
            rule: "Host(`stats.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: site-stats
            tls: {}
          site-home-web:
            rule: "Host(`${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: site-home
          site-stats-web:
            rule: "Host(`stats.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: site-stats
          authelia:
            rule: "Host(`auth.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: authelia
            tls: {}
          s3:
            rule: "Host(`s3.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: garage-s3
            tls: {}
          ldap:
            rule: "Host(`ldap.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: lldap
            tls: {}
          lighting:
            rule: "Host(`lighting.${BASE_DOMAIN:-vex.localhost}`) || Host(`lights.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: lighting-auth
            tls: {}
          # comp.BASE (public competitors page): only "/" (redirected to /site),
          # the page and its API are served, on the tunnel origin (:8081, via
          # Cloudflare) and on the LAN (:443). Anything else on that host is
          # blocked, so the full app is never reachable under this name.
          # Tunnel origin (plain http; Cloudflare terminates TLS).
          public-root:
            rule: "Host(`comp.${BASE_DOMAIN:-vex.localhost}`) && Path(`/`)"
            entryPoints: [public, web]
            middlewares: [comp-root]
            service: noop@internal
            priority: 100
          public-site:
            rule: >-
              Host(`comp.${BASE_DOMAIN:-vex.localhost}`) &&
              (Path(`/site`) || Path(`/site/leaderboard`) || PathPrefix(`/api/v1/public/site/`))
            entryPoints: [public, web]
            middlewares: [public-compress, app-retry]
            service: app
            priority: 100
          public-block-http:
            rule: "Host(`comp.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: noop@internal
            priority: 10
          # The other named hosts on plain :80, for the homelab ingress backup
          # path (it forwards Host unchanged). Same services as the https routers.
          # REMOTE_APP_HOST is the homelab ingress hostname (it forwards Host unchanged).
          app-web:
            rule: "Host(`tmtools.${BASE_DOMAIN:-vex.localhost}`) || Host(`tmtools-server.local`) || Host(`${REMOTE_APP_HOST:-r-tmtools.vmd1.dev}`)"
            entryPoints: [web]
            middlewares: [app-retry]
            service: app
          # Hashed build files (JS/CSS) come from the static nginx containers.
          app-assets:
            rule: "(Host(`tmtools.${BASE_DOMAIN:-vex.localhost}`) || Host(`tmtools-server.local`)) && PathPrefix(`/assets/`)"
            entryPoints: [websecure]
            service: frontend-pool
            priority: 200
            tls: {}
          app-assets-web:
            rule: "(Host(`tmtools.${BASE_DOMAIN:-vex.localhost}`) || Host(`tmtools-server.local`) || Host(`${REMOTE_APP_HOST:-r-tmtools.vmd1.dev}`)) && PathPrefix(`/assets/`)"
            entryPoints: [web]
            service: frontend-pool
            priority: 200
          authelia-web:
            rule: "Host(`auth.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: authelia
          s3-web:
            rule: "Host(`s3.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: garage-s3
          ldap-web:
            rule: "Host(`ldap.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: lldap
          lighting-web:
            rule: "Host(`lighting.${BASE_DOMAIN:-vex.localhost}`) || Host(`lights.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [web]
            service: lighting-auth
          # Same on the LAN (https).
          public-root-lan:
            rule: "Host(`comp.${BASE_DOMAIN:-vex.localhost}`) && Path(`/`)"
            entryPoints: [websecure]
            middlewares: [comp-root]
            service: noop@internal
            priority: 100
            tls: {}
          public-site-lan:
            rule: >-
              Host(`comp.${BASE_DOMAIN:-vex.localhost}`) &&
              (Path(`/site`) || Path(`/site/leaderboard`) || PathPrefix(`/api/v1/public/site/`))
            entryPoints: [websecure]
            middlewares: [public-compress, app-retry]
            service: app
            priority: 100
            tls: {}
          public-block:
            rule: "Host(`comp.${BASE_DOMAIN:-vex.localhost}`)"
            entryPoints: [websecure]
            service: noop@internal
            priority: 10
            tls: {}
        services:
          # Two HAProxy copies in front of the app containers (Traefik health-checks each): they balance REST and the public site over every healthy
          # container and sends /ws/* to whichever one currently leads (stack/config/haproxy.cfg).
          app:
            loadBalancer:
              healthCheck:
                path: /_haproxy
                interval: 2s
                timeout: 2s
              servers:
                - url: http://haproxy-1:8000
                - url: http://haproxy-2:8000
          frontend-pool:
            loadBalancer:
              healthCheck:
                path: /index.html
                interval: 10s
                timeout: 3s
              servers:
                - url: http://frontend-1:8080
                - url: http://frontend-2:8080
          site-home:
            loadBalancer:
              servers:
                - url: http://site-home:8080
          site-stats:
            loadBalancer:
              servers:
                - url: http://site-stats:8080
          authelia:
            loadBalancer:
              servers:
                - url: http://authelia:9091
          garage-s3:
            loadBalancer:
              servers:
                - url: http://garage:3900
          lldap:
            loadBalancer:
              servers:
                - url: http://lldap:17170
          # oauth2-proxy (OIDC login) in front of the lighting tracker; every lighting host uses it.
          lighting-auth:
            loadBalancer:
              servers:
                - url: http://lighting-auth:4180
