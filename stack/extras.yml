# Optional profiles: lighting tracker, Mumble voice, Cloudflare tunnel.
# Part of compose.stack.yml (see its header for configuration).

# Brand theme for both public sites (robotics-home / robotics-stats). Every value is optional: unset = the TMTools brand
# built into the images. Set SITES_THEME_* (dark palette) / SITES_THEME_LIGHT_* (light palette) in .env to override.
x-site-theme: &site-theme
  THEME_MODE: ${SITES_THEME_MODE:-}
  THEME_BG: ${SITES_THEME_BG:-}
  THEME_BG2: ${SITES_THEME_BG2:-}
  THEME_CARD: ${SITES_THEME_CARD:-}
  THEME_RAISE: ${SITES_THEME_RAISE:-}
  THEME_LINE: ${SITES_THEME_LINE:-}
  THEME_INK: ${SITES_THEME_INK:-}
  THEME_MUTED: ${SITES_THEME_MUTED:-}
  THEME_ACCENT: ${SITES_THEME_ACCENT:-}
  THEME_LINK: ${SITES_THEME_LINK:-}
  THEME_OK: ${SITES_THEME_OK:-}
  THEME_RED: ${SITES_THEME_RED:-}
  THEME_BLUE: ${SITES_THEME_BLUE:-}
  THEME_LIGHT_BG: ${SITES_THEME_LIGHT_BG:-}
  THEME_LIGHT_BG2: ${SITES_THEME_LIGHT_BG2:-}
  THEME_LIGHT_CARD: ${SITES_THEME_LIGHT_CARD:-}
  THEME_LIGHT_RAISE: ${SITES_THEME_LIGHT_RAISE:-}
  THEME_LIGHT_LINE: ${SITES_THEME_LIGHT_LINE:-}
  THEME_LIGHT_INK: ${SITES_THEME_LIGHT_INK:-}
  THEME_LIGHT_MUTED: ${SITES_THEME_LIGHT_MUTED:-}
  THEME_LIGHT_ACCENT: ${SITES_THEME_LIGHT_ACCENT:-}
  THEME_LIGHT_LINK: ${SITES_THEME_LIGHT_LINK:-}
  THEME_LIGHT_OK: ${SITES_THEME_LIGHT_OK:-}
  THEME_LIGHT_RED: ${SITES_THEME_LIGHT_RED:-}
  THEME_LIGHT_BLUE: ${SITES_THEME_LIGHT_BLUE:-}
  IQ_COLOR: ${SITES_IQ_COLOR:-}
  V5_COLOR: ${SITES_V5_COLOR:-}
  FONT_HEADING: ${SITES_FONT_HEADING:-}

services:
  # Small caching resolver for the site LAN: answers BASE_DOMAIN and *.BASE_DOMAIN
  # with DNS_ANSWER_IP (this server) and forwards everything else to DNS_UPSTREAM.
  # Point DHCP/clients at DNS_BIND_IP. Binds that one address only (the tunnel
  # agent already holds 127.0.0.153:53 on the host).
  dns:
    profiles: [dns]
    image: alpine:3.20
    entrypoint: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && exec dnsmasq --keep-in-foreground --no-daemon --no-resolv --no-hosts --interface=eth0 --cache-size=1000 --log-queries=extra --log-facility=- --server=${DNS_UPSTREAM:-1.1.1.1} --address=/${BASE_DOMAIN:-vex.localhost}/${DNS_ANSWER_IP:-127.0.0.1} --address=/tmtools-server.local/${DNS_ANSWER_IP:-127.0.0.1}"]
    ports:
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/udp"
      - "${DNS_BIND_IP:-127.0.0.1}:53:53/tcp"
    cap_add: [NET_ADMIN]
    restart: unless-stopped

  # Public robotics sites (aroboticsteam/robotics-home and robotics-stats):
  # https://BASE (landing page) and https://stats.BASE (VEX IQ / V5 leaderboards,
  # which proxies the RobotEvents API with VEX_API_KEY). Images come from the
  # local registry because the school network blocks ghcr.io. Behind Traefik only
  # (no published ports). Branding via SITES_* in .env (SITES_NAV_LINKS / SITES_CARDS
  # are JSON arrays; logos/images go in SITES_MEDIA_DIR, served at /media/).
  site-home:
    profiles: [sites]
    image: ${SITE_HOME_IMAGE:-registry.example.net/robotics-home:latest}
    environment:
      <<: *site-theme
      SITE_TITLE: ${SITES_TITLE:-TMTools Robotics}
      TAGLINE: ${SITES_TAGLINE:-}
      WELCOME_HEADING: ${SITES_WELCOME_HEADING:-}
      STATS_URL: https://stats.${BASE_DOMAIN:-vex.localhost}
      NAV_LINKS: ${SITES_NAV_LINKS:-}
      CARDS: ${SITES_CARDS:-}
      LOGO_URL: ${SITES_LOGO_URL:-}
      LOGO_ALT: ${SITES_LOGO_ALT:-}
      LOGO_HREF: ${SITES_LOGO_HREF:-}
      LOGO_DARK_URL: ${SITES_LOGO_DARK_URL:-}
      FOOTER_TEXT: ${SITES_FOOTER_TEXT:-}
      FOOTER_SECONDARY_TEXT: ${SITES_FOOTER_SECONDARY_TEXT:-VEX Robotics Competition}
    volumes:
      - ${SITES_MEDIA_DIR:-./sites-media}:/media:ro
    restart: unless-stopped

  site-stats:
    profiles: [sites]
    image: ${SITE_STATS_IMAGE:-registry.example.net/robotics-stats:latest}
    environment:
      <<: *site-theme
      VEX_API_KEY: ${VEX_API_KEY:-}
      TEAMS_VIQRC: ${TEAMS_VIQRC:-}
      TEAMS_V5RC: ${TEAMS_V5RC:-}
      SITE_TITLE: ${SITES_TITLE:-TMTools Robotics} Stats
      HOME_URL: https://${BASE_DOMAIN:-vex.localhost}
      LOGO_URL: ${SITES_LOGO_URL:-}
      LOGO_ALT: ${SITES_LOGO_ALT:-}
      LOGO_HREF: ${SITES_LOGO_HREF:-}
      LOGO_DARK_URL: ${SITES_LOGO_DARK_URL:-}
      FOOTER_TEXT: ${SITES_FOOTER_TEXT:-}
      FOOTER_SECONDARY_TEXT: ${SITES_FOOTER_SECONDARY_TEXT:-VEX Robotics Competition}
    volumes:
      - ${SITES_MEDIA_DIR:-./sites-media}:/media:ro
    restart: unless-stopped

  # Lighting tracker (aroboticsteam/lightpoint). Host networking so the
  # console's ArtPoll broadcast reaches it; the web UI binds to docker0 only and
  # is published solely through Traefik + oauth2-proxy (service lighting-auth) at https://lighting.BASE.
  lighting:
    profiles: [lighting]
    image: ${LIGHTING_IMAGE:-ghcr.io/aroboticsteam/lightpoint:latest}
    network_mode: host
    environment:
      WEB_HOST: ${HOST_GATEWAY_IP:-172.17.0.1}
      WEB_PORT: "8080"
    volumes:
      - ${LIGHTING_CONFIG_DIR:-./lighting-config}:/config
    healthcheck:
      # The image probes 127.0.0.1; the UI is bound to docker0 instead.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request as u; u.urlopen('http://%s:%s/api/state' % (os.environ['WEB_HOST'], os.environ['WEB_PORT']), timeout=3)\""]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  # Login for the lighting tracker: oauth2-proxy in front of it, speaking plain OIDC. Traefik sends lighting.BASE and
  # lights.BASE here and it proxies to the tracker (websockets included) once the visitor is signed in and in
  # LIGHTING_ALLOWED_GROUPS. The identity provider is whatever the LIGHTING_OIDC_* variables point at: by default the
  # stack's Authelia (client `lighting`, registered by authelia-init.sh). To use another provider (Authentik, Keycloak,
  # Google, Entra ID, ...) set these in .env and nothing else changes:
  #   LIGHTING_OIDC_ISSUER_URL     issuer / discovery URL (default https://auth.BASE)
  #   LIGHTING_OIDC_CLIENT_ID      default `lighting`
  #   LIGHTING_OIDC_CLIENT_SECRET  default: generated into the secrets volume (the value Authelia was given)
  #   LIGHTING_OIDC_PROVIDER       oauth2-proxy provider: oidc (default, any standard OIDC provider) or a specific one
  #   LIGHTING_OIDC_GROUPS_CLAIM   default `groups`;  LIGHTING_OIDC_SCOPE default `openid profile email groups`
  #   LIGHTING_OIDC_USER_CLAIM     claim that names the user, default `preferred_username` (`email` for Google)
  #   LIGHTING_ALLOWED_GROUPS      comma list, default `tmtools-admin`; set it empty to let any signed-in user in
  # The provider must allow the redirect URI https://lighting.BASE/oauth2/callback (and lights.BASE).
  lighting-auth:
    profiles: [lighting]
    image: ${LIGHTING_AUTH_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.7.1-alpine}
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      cert-init:
        condition: service_completed_successfully
      authelia:
        condition: service_started
      traefik:
        condition: service_started  # discovery goes through it (auth.BASE resolves to Traefik on the stack network)
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY_IP:-172.17.0.1}"
    environment:
      LIGHTING_OIDC_CLIENT_SECRET: ${LIGHTING_OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_PROVIDER: ${LIGHTING_OIDC_PROVIDER:-oidc}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${LIGHTING_OIDC_ISSUER_URL:-https://auth.${BASE_DOMAIN:-vex.localhost}}
      OAUTH2_PROXY_CLIENT_ID: ${LIGHTING_OIDC_CLIENT_ID:-lighting}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: ${LIGHTING_OIDC_GROUPS_CLAIM:-groups}
      # Which claim identifies the user (oauth2-proxy calls it "email"). preferred_username because LLDAP users need
      # not have an email address; set `email` for providers without preferred_username (Google).
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: ${LIGHTING_OIDC_USER_CLAIM:-preferred_username}
      OAUTH2_PROXY_SCOPE: ${LIGHTING_OIDC_SCOPE:-openid profile email groups}
      OAUTH2_PROXY_ALLOWED_GROUPS: ${LIGHTING_ALLOWED_GROUPS-tmtools-admin}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: ${LIGHTING_OIDC_PKCE:-S256}
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Behind Traefik: trust X-Forwarded-Host/-Proto so the callback URL follows the host the visitor used
      # (lighting.BASE or lights.BASE). Login only works over https (secure cookie).
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_REDIRECT_URL: ${LIGHTING_OIDC_REDIRECT_URL:-}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: lighting_session
      OAUTH2_PROXY_COOKIE_EXPIRE: ${LIGHTING_SESSION_HOURS:-12}h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # System roots + the stack's self-signed cert + EXTRA_CA_FILE (built by cert-init), as for the app.
      SSL_CERT_FILE: /certs/ca-bundle.pem
    entrypoint:
      - sh
      - -c
      # The generated client and cookie secrets come from the secrets volume; LIGHTING_OIDC_CLIENT_SECRET in .env wins.
      - |
        client_secret="$${LIGHTING_OIDC_CLIENT_SECRET:-}"
        . /secrets/env
        export OAUTH2_PROXY_CLIENT_SECRET="$${client_secret:-$$LIGHTING_OIDC_CLIENT_SECRET}" OAUTH2_PROXY_COOKIE_SECRET="$$LIGHTING_COOKIE_SECRET"
        exec /bin/oauth2-proxy
    volumes:
      - secrets:/secrets:ro
      - certs:/certs:ro
    restart: unless-stopped

  # Voice for the desks and iPads. LAN only: plain TCP/UDP, not behind Traefik.
  # Uses Mumble's own self-signed certificate (a trusted one via
  # traefik-certs-dumper is a follow-up). Data in the `mumble` volume.
  mumble:
    profiles: [voice]
    image: mumblevoip/mumble-server:v1.6.1001
    environment:
      MUMBLE_CONFIG_SERVERPASSWORD: ${MUMBLE_PASSWORD:-}
      MUMBLE_CONFIG_WELCOMETEXT: "TMTools voice"
      MUMBLE_CONFIG_USERS: "100"
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - mumble:/data
    restart: unless-stopped

  # Cloudflare tunnel for the public competitors page only. Cloudflare terminates
  # TLS; the tunnel's public hostname (comp.BASE) points at http://traefik:8081,
  # an entrypoint that serves only the allowlisted /site paths (see cfg_dynamic).
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # TCP 7844 instead of QUIC/UDP, friendlier to firewalls.
      TUNNEL_TRANSPORT_PROTOCOL: http2
      SSL_CERT_FILE: /certs/ca-bundle.pem
    volumes:
      - certs:/certs:ro
    depends_on:
      traefik:
        condition: service_started
    restart: unless-stopped

volumes:
  mumble:
