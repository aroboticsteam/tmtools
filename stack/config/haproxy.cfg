# HAProxy between Traefik and the app containers (stack/core.yml).
#
#   Traefik -> haproxy-1:8000 and haproxy-2:8000 (two identical copies, so one can die or restart) -> every `app` container (leader-eligible) and `app-worker` container (workers, `scale` profile)
#
# * Everything except /ws is balanced across every healthy app container (REST, public site, SPA).
# * /ws/* goes only to the node that currently holds the leader lock: the prompter and the other
#   leader-only sockets need the leader's timer manager. The leader is whoever answers 200 on /leaderz,
#   so routing follows a failover within a few seconds with no config change.
# * Containers are found through Docker's DNS: `server-template` gives each service name up to N slots and
#   fills one per container IP, so `docker compose up --scale app=2 --scale app-worker=4` (or APP_REPLICAS /
#   APP_WORKERS) needs no change here. A slot with no container, or an unhealthy one, is skipped, and
#   `init-addr none` lets HAProxy start before any of them exist.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option dontlognull
    option redispatch
    retries 2
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
    timeout http-keep-alive 10s
    timeout http-request 15s
    default-server check inter 3s fall 2 rise 2 resolvers docker init-addr none

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold nx 5s

frontend app_in
    bind :8000
    # Answered by HAProxy itself (200 while it runs, whatever the backends do); Traefik health-checks this.
    monitor-uri /_haproxy
    acl is_ws path_beg /ws
    use_backend leader_only if is_ws
    default_backend app_all

backend app_all
    balance leastconn
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    http-response add-header X-Served-By %s
    server-template app 1-4 app:8000
    server-template worker 1-8 app-worker:8000

backend leader_only
    balance first
    option httpchk
    http-check send meth GET uri /leaderz
    http-check expect status 200
    http-response add-header X-Served-By %s
    server-template app 1-4 app:8000

# Internal only (not published): `docker compose exec haproxy wget -qO- localhost:8404/stats\;csv`
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    http-request use-service prometheus-exporter if { path /metrics }
